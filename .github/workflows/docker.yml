name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - fix

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      users: ${{ steps.filter.outputs.users }}
      events: ${{ steps.filter.outputs.events }}
      reservation: ${{ steps.filter.outputs.reservation }}
      notification: ${{ steps.filter.outputs.notification }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'src/auth/**'

            users:
              - 'src/Users/**'

            events:
              - 'src/Events/**'

            reservation:
              - 'src/reservation/**'

            notification:
              - 'src/Notification/**'


  auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Auth
        run: |
          docker build \
            -t logtaha/sportik-auth-service:latest \
            -t logtaha/sportik-auth-service:sha-${GITHUB_SHA::7} \
            ./src/auth

          docker push logtaha/sportik-auth-service:latest
          docker push logtaha/sportik-auth-service:sha-${GITHUB_SHA::7}


  users:
    needs: changes
    if: needs.changes.outputs.users == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Users
        run: |
          docker build \
            -t logtaha/sportik-user-service:latest \
            -t logtaha/sportik-user-service:sha-${GITHUB_SHA::7} \
            ./src/Users

          docker push logtaha/sportik-user-service:latest
          docker push logtaha/sportik-user-service:sha-${GITHUB_SHA::7}


  events:
    needs: changes
    if: needs.changes.outputs.events == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Events
        run: |
          docker build \
            -t logtaha/sportik-event-service:latest \
            -t logtaha/sportik-event-service:sha-${GITHUB_SHA::7} \
            ./src/Events/EventService

          docker push logtaha/sportik-event-service:latest
          docker push logtaha/sportik-event-service:sha-${GITHUB_SHA::7}


  reservation:
    needs: changes
    if: needs.changes.outputs.reservation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Reservation
        run: |
          docker build \
            -t logtaha/sportik-reservation-service:latest \
            -t logtaha/sportik-reservation-service:sha-${GITHUB_SHA::7} \
            ./src/reservation

          docker push logtaha/sportik-reservation-service:latest
          docker push logtaha/sportik-reservation-service:sha-${GITHUB_SHA::7}


  notification:
    needs: changes
    if: needs.changes.outputs.notification == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Notification
        run: |
          docker build \
            -t logtaha/sportik-notification-service:latest \
            -t logtaha/sportik-notification-service:sha-${GITHUB_SHA::7} \
            ./src/Notification/NotificationService

          docker push logtaha/sportik-notification-service:latest
          docker push logtaha/sportik-notification-service:sha-${GITHUB_SHA::7}