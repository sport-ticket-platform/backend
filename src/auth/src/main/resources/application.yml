server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    # TODO: change this part when it wants to run in container
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sportik-backend}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:taha1111}
  jpa:
    hibernate:
      # TODO: Change it in server
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  output:
    ansi:
      enabled: always
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # Connect to redis
  data:
    redis:
      # TODO: change this part when it wants to run in container
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

#  OpenTelemetry
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4317}
      transport: grpc

app:
  security:
    public-paths:
      - /api/auth/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

    jwt:
      private-key: classpath:keys/private_key.pem
      public-key: classpath:keys/public_key.pem
      access-token-expiration-sec: 900
      refresh-token-expiration-sec: 2592000
      issuer: auth-service
      audience: frontend

    mfa_token_ttl_min: 2
  rabbitmq:
    email-queue: emailQueue

grpc:
  client:
    user-service:
      address: ${USER_SERVICE_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext