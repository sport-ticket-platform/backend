syntax = "proto3";

import "google/protobuf/empty.proto";

package notification;

option csharp_namespace = "NotificationService.Grpc";

service NotificationService {

  rpc SendHtmlEmail(SendEmailRequest) returns (google.protobuf.Empty);
  rpc SendTextEmail(SendEmailRequest) returns (google.protobuf.Empty);

}

message SendEmailRequest{
  string to = 1;
  string subject = 2;
  string body = 3;
}
